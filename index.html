<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoxSwap - Instant Cross-Chain Crypto Swaps</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      padding: 16px 40px;
      background: #0d1a0d;
      border-bottom: 1px solid rgba(0, 255, 100, 0.08);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-area img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0, 255, 100, 0.5));
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: #22c55e;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.6rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 14px;
      text-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
    }

    .hero .tagline {
      color: #9ca3af;
      font-size: 1.05rem;
      margin-bottom: 40px;
    }

    .widget-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .footer-note {
      margin-top: 30px;
      color: #4b5563;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 14px 20px;
      }
      .hero h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo-area">
      <img src="logo.png" alt="StoxSwap Logo" width="42" height="42">
      <span class="logo-text">StoxSwap</span>
    </a>
  </header>

  <section class="hero">
    <h1>Instant Cross-Chain Crypto Swaps</h1>
    <p class="tagline">
      No account • No KYC • Non-custodial • 2000+ assets
    </p>

    <!-- Official StealthEX Widget -->
    <div class="widget-wrapper">
      <iframe 
        id="stealthex-widget" 
        src="https://stealthex.io/widget/9af4400f-05b5-446b-8345-0306d32995a9" 
        style="border: none; border-radius: 16px; overflow: hidden; width: 100%; max-width: 480px; height: 430px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);"
        allow="clipboard-write">
      </iframe>
    </div>

    <p class="footer-note">Non-custodial • No registration required</p>
  </section>

</body>
</html>
