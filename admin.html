<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk ops — Stoxswap</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="/"><span class="mark"></span> STOXSWAP OPS</a>
    </header>
    <div class="card">
      <label>Admin token</label>
      <input id="token" type="password" />
      <button class="btn" id="load" type="button" style="margin-top:12px">Load orders</button>
      <p class="notice" id="msg"></p>
    </div>
    <div class="card" style="margin-top:16px; overflow:auto">
      <table>
        <thead>
          <tr><th>ID</th><th>Pair</th><th>Send</th><th>Status</th><th>Update</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script>
    const statuses = ["awaiting_deposit","deposit_seen","settling","payout_sent","completed","refunded","cancelled"];

    function localOrders() {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("stox_order_")) continue;
        try { out.push(JSON.parse(localStorage.getItem(k))); } catch {}
      }
      return out;
    }

    function render(list) {
      document.getElementById("rows").innerHTML = list.map(o => `
        <tr>
          <td>${o.id}</td>
          <td>${o.from}→${o.to}</td>
          <td>${o.send}</td>
          <td>${o.status}</td>
          <td>
            <select onchange="upd('${o.id}', this.value)">
              ${statuses.map(s => `<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
            </select>
          </td>
        </tr>`).join("");
    }

    document.getElementById("load").onclick = async () => {
      const token = document.getElementById("token").value;
      const msg = document.getElementById("msg");
      msg.textContent = "Loading…";
      let server = [];
      try {
        const res = await fetch("/api/admin", { headers: { "x-admin-token": token } });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.error || "Unauthorized"; return; }
        server = data.orders || [];
      } catch (e) {
        msg.textContent = "Admin API error: " + e.message;
        render(localOrders());
        return;
      }
      const local = localOrders();
      const map = new Map();
      [...server, ...local].forEach((o) => { if (o && o.id) map.set(o.id, o); });
      const list = [...map.values()].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
      render(list);
      msg.textContent = `Server ${server.length} · this browser ${local.length} · shown ${list.length}. Server list resets on each deploy (Hobby has no database).`;
      window._tok = token;
    };

    async function upd(id, status) {
      await fetch("/api/admin", {
        method: "POST",
        headers: { "content-type": "application/json", "x-admin-token": window._tok },
        body: JSON.stringify({ id, status })
      });
    }
  </script>
</body>
</html>
